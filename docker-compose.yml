version: '3.8'

services:
  moco-mcp-server:
    build: .
    environment:
      - MOCO_DOMAIN=${MOCO_DOMAIN}
      - MOCO_API_KEY=${MOCO_API_KEY}
      - MOCO_READ_ONLY=${MOCO_READ_ONLY:-false}
    # MCP servers communicate over stdio, so we need to ensure 
    # docker-compose attaches stdin/stdout properly when running interactively
    stdin_open: true
    tty: true
